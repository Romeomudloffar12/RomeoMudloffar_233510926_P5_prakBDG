<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pokemon Graph Data Science (GDS) Explorer</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f6f9; }
        #header { background-color: #2b3e50; color: white; padding: 15px 20px; text-align: center; }
        #mynetwork { width: 100vw; height: calc(100vh - 80px); background-color: #ffffff; border-top: 2px solid #ccc; }
    </style>
</head>
<body>

    <div id="header">
        <h2>Pokemon Graph Data Science (GDS) Explorer</h2>
    </div>
    
    <div id="mynetwork"></div>

    <script type="text/javascript">
        // Data Sample Graph Pokemon GDS
        var nodes = new vis.DataSet([
            { id: 1, label: 'Bulbasaur', group: 'Pokemon', shape: 'dot', size: 25, color: '#4CAF50' },
            { id: 2, label: 'Ivysaur', group: 'Pokemon', shape: 'dot', size: 20, color: '#4CAF50' },
            { id: 3, label: 'Venusaur', group: 'Pokemon', shape: 'dot', size: 30, color: '#4CAF50' },
            { id: 4, label: 'Charmander', group: 'Pokemon', shape: 'dot', size: 25, color: '#FF5722' },
            { id: 5, label: 'Charmeleon', group: 'Pokemon', shape: 'dot', size: 20, color: '#FF5722' },
            { id: 6, label: 'Charizard', group: 'Pokemon', shape: 'dot', size: 35, color: '#FF5722' },
            { id: 7, label: 'Squirtle', group: 'Pokemon', shape: 'dot', size: 25, color: '#2196F3' },
            { id: 8, label: 'Wartortle', group: 'Pokemon', shape: 'dot', size: 20, color: '#2196F3' },
            { id: 9, label: 'Blastoise', group: 'Pokemon', shape: 'dot', size: 35, color: '#2196F3' },
            { id: 10, label: 'Grass', group: 'Type', shape: 'diamond', size: 30, color: '#8BC34A' },
            { id: 11, label: 'Fire', group: 'Type', shape: 'diamond', size: 30, color: '#F44336' },
            { id: 12, label: 'Water', group: 'Type', shape: 'diamond', size: 30, color: '#03A9F4' },
            { id: 13, label: 'Poison', group: 'Type', shape: 'diamond', size: 25, color: '#9C27B0' },
            { id: 14, label: 'Overgrow', group: 'Ability', shape: 'triangle', size: 20, color: '#CDDC39' },
            { id: 15, label: 'Blaze', group: 'Ability', shape: 'triangle', size: 20, color: '#FF9800' },
            { id: 16, label: 'Torrent', group: 'Ability', shape: 'triangle', size: 20, color: '#00BCD4' }
        ]);

        var edges = new vis.DataSet([
            { from: 1, to: 2, label: 'EVOLVES_TO', arrows: 'to' },
            { from: 2, to: 3, label: 'EVOLVES_TO', arrows: 'to' },
            { from: 4, to: 5, label: 'EVOLVES_TO', arrows: 'to' },
            { from: 5, to: 6, label: 'EVOLVES_TO', arrows: 'to' },
            { from: 7, to: 8, label: 'EVOLVES_TO', arrows: 'to' },
            { from: 8, to: 9, label: 'EVOLVES_TO', arrows: 'to' },
            { from: 1, to: 10, label: 'HAS_TYPE' },
            { from: 1, to: 13, label: 'HAS_TYPE' },
            { from: 4, to: 11, label: 'HAS_TYPE' },
            { from: 7, to: 12, label: 'HAS_TYPE' },
            { from: 1, to: 14, label: 'HAS_ABILITY' },
            { from: 4, to: 15, label: 'HAS_ABILITY' },
            { from: 7, to: 16, label: 'HAS_ABILITY' },
            { from: 1, to: 4, label: 'SIMILAR_TO', dashes: true },
            { from: 4, to: 7, label: 'SIMILAR_TO', dashes: true }
        ]);

        var container = document.getElementById('mynetwork');
        var data = { nodes: nodes, edges: edges };
        var options = {
            nodes: { font: { size: 14, color: '#333333' } },
            edges: { font: { size: 11, align: 'middle' }, color: { color: '#888888' } },
            physics: { enabled: true, barnesHut: { gravitationalConstant: -3000 } }
        };

        var network = new vis.Network(container, data, options);
    </script>
</body>
</html>
